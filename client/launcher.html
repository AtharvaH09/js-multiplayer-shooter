<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="public/logo.svg" />
  <title>VORN! Launcher</title>
  <style>
    body {
      background-color: black;
      margin: 0;
      padding: 0;
      color: white;
      font-family: sans-serif;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title {
      height: 20rem;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login,
    .signup,
    .dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-align: center;
    }

    #loginBtn {
      width: 100%;
    }

    fieldset {
      padding: 2rem;
      margin: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    button {
      width: fit-content;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    a {
      color: white;
    }

    #status,
    #signupStatus {
      margin-top: 1rem;
      color: #0f0;
      font-size: 0.9rem;
    }

    .hidden {
      display: none;
    }

    table {
      border-collapse: collapse;
      width: 80%;
      margin: 1rem auto;
    }

    th,
    td {
      border: 1px solid #555;
      padding: 0.5rem;
      text-align: center;
    }

    th {
      background-color: #222;
    }

    .leaderboard-section {
      text-align: center;
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <header>
    <img src="public/title.svg" class="title" alt="game title" />
  </header>

  <section class="main">
    <!-- LOGIN SECTION -->
    <section class="login" id="loginSection">
      <fieldset>
        <legend>Login</legend>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button id="loginBtn">Login</button>
      </fieldset>
      Don't have an account?
      <button id="showSignupBtn">Signup</button>
      Or
      <button id="guestBtn">Continue as Guest</button>
      <div id="status"></div>
    </section>

    <!-- SIGNUP SECTION -->
    <section class="signup hidden" id="signupSection">
      <fieldset>
        <legend>Signup</legend>
        <input type="text" id="newUsername" placeholder="Choose username" />
        <input type="password" id="newPassword" placeholder="Choose password" />
        <button id="doSignupBtn">Create Account</button>
      </fieldset>
      Already have an account?
      <button id="backToLoginBtn">Back to Login</button>
      <div id="signupStatus"></div>
    </section>

    <!-- DASHBOARD SECTION -->
    <section class="dashboard hidden" id="dashboardSection">
      <h2 id="welcomeMsg"></h2>
      <button id="playBtn">Play Game</button>
      <button id="logoutBtn">Logout</button>

      <div class="leaderboard-section">
        <h3>Leaderboards</h3>
        <div id="leaderboardContainer"></div>
      </div>
    </section>
  </section>

  <footer></footer>

  <script>
    const API_URL = "http://localhost:5555";
    const GAME_URL = "http://localhost:5173";

    const status = document.getElementById("status");
    const signupStatus = document.getElementById("signupStatus");
    const loginSection = document.getElementById("loginSection");
    const signupSection = document.getElementById("signupSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const welcomeMsg = document.getElementById("welcomeMsg");
    const leaderboardContainer = document.getElementById("leaderboardContainer");

    // Helper to switch sections
    function showSection(section) {
      [loginSection, signupSection, dashboardSection].forEach((s) => s.classList.add("hidden"));
      section.classList.remove("hidden");
    }

    // Check authentication
    async function checkAuth() {
      const token = localStorage.getItem("token");
      if (!token) {
        showSection(loginSection);
        await loadGuestLeaderboard();
        return;
      }

      try {
        const res = await fetch(`${API_URL}/players/profile`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error("Not authenticated");

        const player = await res.json();
        showSection(dashboardSection);
        welcomeMsg.textContent = `Welcome back, ${player.username}!`;
        await loadFullLeaderboard();

        document.getElementById("logoutBtn").onclick = () => {
          localStorage.removeItem("token");
          location.reload();
        };
        document.getElementById("playBtn").onclick = () => {
          window.location.href = `${GAME_URL}?token=${token}`;
        };
      } catch {
        localStorage.removeItem("token");
        showSection(loginSection);
        await loadGuestLeaderboard();
      }
    }

    // LOGIN
    document.getElementById("loginBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        status.textContent = "Please fill in both fields.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/players/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.message || "Login failed.";
          return;
        }

        localStorage.setItem("token", data.token);
        status.textContent = "Login successful!";
        setTimeout(() => location.reload(), 800);
      } catch {
        status.textContent = "Network error.";
      }
    };

    // SIGNUP
    document.getElementById("showSignupBtn").onclick = () => showSection(signupSection);
    document.getElementById("backToLoginBtn").onclick = () => showSection(loginSection);

    document.getElementById("doSignupBtn").onclick = async () => {
      const username = document.getElementById("newUsername").value.trim();
      const password = document.getElementById("newPassword").value.trim();

      if (!username || !password) {
        signupStatus.textContent = "Please fill in both fields.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/players/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          signupStatus.textContent = data.message || "Signup failed.";
          return;
        }

        signupStatus.textContent = "Signup successful! Please login.";
      } catch {
        signupStatus.textContent = "Network error.";
      }
    };

    // GUEST MODE
    document.getElementById("guestBtn").onclick = async () => {
      alert("Playing as Guest. Progress will not be saved.");
      localStorage.removeItem("token");
      showSection(dashboardSection);
      welcomeMsg.textContent = "Welcome, Guest Player!";
      await loadGuestLeaderboard();

      document.getElementById("logoutBtn").onclick = () => location.reload();
      document.getElementById("playBtn").onclick = () => {
        window.location.href = `${GAME_URL}?guest=true`;
      };
    };

    // Load leaderboards for logged-in users
    async function loadFullLeaderboard() {
      leaderboardContainer.innerHTML = "<p>Loading leaderboards...</p>";

      try {
        const [matchesRes, killsRes, kdRes] = await Promise.all([
          fetch(`${API_URL}/leaderboard/matches`),
          fetch(`${API_URL}/leaderboard/kills`),
          fetch(`${API_URL}/leaderboard/kd`),
        ]);

        const matchesData = await matchesRes.json();
        const killsData = await killsRes.json();
        const kdData = await kdRes.json();

        leaderboardContainer.innerHTML = `
      <h4>Most Matches Played</h4>
      ${makeTable(matchesData, "matchesPlayed")}
      <h4>Top Kills</h4>
      ${makeTable(killsData, "kills")}
      <h4>Top K/D Ratio</h4>
      ${makeTable(kdData, "kdRatio")}
    `;
      } catch {
        leaderboardContainer.innerHTML = "<p>Failed to load leaderboards.</p>";
      }
    }

    // Guest leaderboard
    async function loadGuestLeaderboard() {
      leaderboardContainer.innerHTML = `
    <p>Sign in to appear on the global leaderboards!</p>
    <button id="refreshLeaderboards">View Public Leaderboards</button>
  `;

      document.getElementById("refreshLeaderboards").onclick = async () => {
        try {
          const [matchesRes, killsRes, kdRes] = await Promise.all([
            fetch(`${API_URL}/leaderboard/matches`),
            fetch(`${API_URL}/leaderboard/kills`),
            fetch(`${API_URL}/leaderboard/kd`),
          ]);

          const matchesData = await matchesRes.json();
          const killsData = await killsRes.json();
          const kdData = await kdRes.json();

          leaderboardContainer.innerHTML = `
        <h4>Most Matches Played</h4>
        ${makeTable(matchesData, "matchesPlayed")}
        <h4>Top Kills</h4>
        ${makeTable(killsData, "kills")}
        <h4>Top K/D Ratio</h4>
        ${makeTable(kdData, "kdRatio")}
        <p><i>Login to join the leaderboard!</i></p>
      `;
        } catch {
          leaderboardContainer.innerHTML = "<p>Failed to load leaderboards.</p>";
        }
      };
    }

    // Helper to render table
    function makeTable(list, fieldName) {
      if (!list || !list.length) return "<p>No data yet.</p>";
      let rows = list
        .map(
          (p, i) => `<tr><td>${i + 1}</td><td>${p.username || "Unknown"}</td><td>${p[fieldName] ?? 0}</td></tr>`
        )
        .join("");
      return `<table><tr><th>#</th><th>Player</th><th>Stat</th></tr>${rows}</table>`;
    }

    // Run on load
    checkAuth();
  </script>

</body>

</html>
