<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="public/logo.svg" />
  <title>VORN! Launcher</title>
  <style>
    body {
      background-color: black;
      margin: 0;
      padding: 0;
      color: white;
      font-family: sans-serif;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title {
      height: 20rem;
    }

    .main {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login,
    .signup,
    .profile {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 0.5rem;
    }

    fieldset {
      padding: 2rem;
      margin: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 0.5rem;
    }

    button {
      width: fit-content;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    a {
      color: white;
    }

    #status,
    #signupStatus {
      margin-top: 1rem;
      color: #0f0;
      font-size: 0.9rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <img src="public/title.svg" class="title" alt="game title">
  </header>

  <section class="main">
    <!-- LOGIN -->
    <section class="login" id="loginSection">
      <fieldset>
        <legend>Login</legend>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button id="loginBtn">Login</button>
      </fieldset>
      Don't have an account?
      <button id="showSignupBtn">Signup</button>
      Or
      <button id="guestBtn">Continue as Guest</button>
      <div id="status"></div>
    </section>

    <!-- SIGNUP -->
    <section class="signup hidden" id="signupSection">
      <fieldset>
        <legend>Signup</legend>
        <input type="text" id="newUsername" placeholder="Choose username" />
        <input type="password" id="newPassword" placeholder="Choose password" />
        <button id="doSignupBtn">Create Account</button>
      </fieldset>
      Already have an account?
      <button id="backToLoginBtn">Back to Login</button>
      <div id="signupStatus"></div>
    </section>

    <!-- PROFILE -->
    <section class="profile hidden" id="profileSection">
      <fieldset>
        <legend>Welcome</legend>
        <p id="welcomeMsg"></p>
        <button id="logoutBtn">Logout</button>
        <button id="playBtn">Play Game</button>
      </fieldset>

      <fieldset>
        <legend>Match History</legend>
        <ul id="matchHistory"></ul>
      </fieldset>
    </section>
  </section>

  <footer></footer>

  <script>
    const API_URL = "http://localhost:5555";
    const GAME_URL = "http://localhost:5173";

    const status = document.getElementById("status");
    const signupStatus = document.getElementById("signupStatus");
    const profileSection = document.getElementById("profileSection");
    const loginSection = document.getElementById("loginSection");
    const signupSection = document.getElementById("signupSection");
    const welcomeMsg = document.getElementById("welcomeMsg");
    const matchHistory = document.getElementById("matchHistory");

    // ====== Check if already logged in ======
    async function checkLogin() {
      const token = localStorage.getItem("token");
      if (!token) return;

      try {
        const res = await fetch(`${API_URL}/players/profile`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (!res.ok) {
          localStorage.removeItem("token");
          return;
        }

        const player = await res.json();

        // Switch UI
        loginSection.classList.add("hidden");
        signupSection.classList.add("hidden");
        profileSection.classList.remove("hidden");

        welcomeMsg.textContent = `Hello, ${player.username}!`;

        // Fetch match history
        const matchRes = await fetch(`${API_URL}/matches`);
        const matches = await matchRes.json();

        const playerMatches = matches.filter(m =>
          m.participants.some(p =>
            p.player && (p.player._id === player._id || p.player === player._id)
          )
        );

        if (playerMatches.length > 0) {
          matchHistory.innerHTML = "";
          playerMatches.forEach((m) => {
            const li = document.createElement("li");
            const score = `${m.scoreA} - ${m.scoreB}`;
            li.textContent = `Match: ${score} (Teams: ${m.teamA.length}v${m.teamB.length})`;
            matchHistory.appendChild(li);
          });
        } else {
          matchHistory.innerHTML = "<li>No matches yet.</li>";
        }
      } catch (err) {
        console.error("Auth check failed", err);
        localStorage.removeItem("token");
      }
    }

    // ====== Login ======
    document.getElementById("loginBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        status.textContent = "Please fill in both fields.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/players/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.message || "Login failed.";
          return;
        }

        localStorage.setItem("token", data.token);
        status.textContent = "Login successful!";
        setTimeout(checkLogin, 500);
      } catch (err) {
        status.textContent = "Network error.";
      }
    };

    // ====== Signup ======
    document.getElementById("doSignupBtn").onclick = async () => {
      const username = document.getElementById("newUsername").value.trim();
      const password = document.getElementById("newPassword").value.trim();

      if (!username || !password) {
        signupStatus.textContent = "Please fill in both fields.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/players/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          signupStatus.textContent = data.message || "Signup failed.";
          return;
        }

        signupStatus.textContent = "Signup successful! Please login.";
      } catch (err) {
        signupStatus.textContent = "Network error.";
      }
    };

    // ====== UI Switches ======
    document.getElementById("showSignupBtn").onclick = () => {
      loginSection.classList.add("hidden");
      signupSection.classList.remove("hidden");
    };
    document.getElementById("backToLoginBtn").onclick = () => {
      signupSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
    };

    // ====== Guest ======
    document.getElementById("guestBtn").onclick = () => {
      alert("Playing as Guest. Progress will not be saved.");
      localStorage.removeItem("token");
      window.location.href = `${GAME_URL}?guest=true`;
    };

    // ====== Logout ======
    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("token");
      profileSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
    };

    // ====== Play Button ======
    document.getElementById("playBtn").onclick = () => {
      const token = localStorage.getItem("token");
      if (token) {
        window.location.href = `${GAME_URL}?token=${token}`;
      }
    };

    // Run on load
    checkLogin();
  </script>
</body>

</html>
